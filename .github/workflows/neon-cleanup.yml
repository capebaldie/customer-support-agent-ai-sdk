# Neon branches are deleted by the retrieval workflow's own cleanup step, but a cancelled or crashed
# run never reaches it. This catches those: abandoned branches otherwise accumulate on the project.
name: Delete Neon branch

on:
  pull_request:
    types: [closed]
    # Must stay identical to retrieval.yml's filter. A path that runs the eval but not this job
    # leaks a Neon branch on every PR; GitHub Actions has no way to share the list between files.
    paths:
      - 'content/docs/**'
      - 'lib/db/**'
      - 'lib/rag/chunk.ts'
      - 'lib/rag/embedding.ts'
      - 'lib/rag/search.ts'
      - 'eval/questions.ts'
      - 'eval/search-queries.json'
      - 'scripts/ingest.ts'
      - 'scripts/eval.ts'

jobs:
  delete:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        continue-on-error: true # already deleted by the retrieval run is the normal case
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
