name: CI

on:
  push:
    branches: [main]
  pull_request:

# `node x | tee y` returns tee's status, not node's, under the default shell — which silently
# swallowed a failing eval gate. `shell: bash` gets -eo pipefail, so a failure anywhere in a
# pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # next build imports lib/env.ts while prerendering; dummy values satisfy it.
      # DATABASE_URL must be well-formed: neon() parses it when lib/db loads (never connects here)
      GOOGLE_GENERATIVE_AI_API_KEY: ci
      DATABASE_URL: postgres://ci:ci@ci.invalid/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # Quoted so node expands it, not bash: node's own glob handles `**`, bash's does not without
      # globstar, and a bare directory argument makes the runner try to import it. Nothing here
      # touches the database or an API.
      - run: node --test "lib/**/*.test.ts"

      # Fails if eval/search-queries.json was captured under a different prompt than lib/rag/prompt.ts.
      # No database and no API calls, so it also runs on fork PRs. See the script for the way out.
      - run: node scripts/check-captures.ts
